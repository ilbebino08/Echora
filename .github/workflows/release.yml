name: Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with a draft release and signed APK
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Build and test
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest :app:assembleDebug

      - name: Verify the signed draft APK and publish the preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          [[ "$draft" == true ]]
          artifact="Echora-$RELEASE_TAG-debug.apk"
          gh release download "$RELEASE_TAG" --pattern "$artifact"
          certificates=$("$sdk_tools/apksigner" verify --print-certs "$artifact")
          # Require the dedicated Echora signing certificate.
          [[ "$certificates" == *"certificate SHA-256 digest: 76ce4f5c9f0ed2fb87ec383550c9361c62297b27d5d9a2be299464f8d2551ce8"* ]]
          for apk in app/build/outputs/apk/debug/app-debug.apk "$artifact"; do
            package=$("$sdk_tools/aapt" dump badging "$apk" | awk -F"'" '/^package: / {print $2 " v" $6}')
            [[ "$package" == "com.echora.app $RELEASE_TAG" ]]
          done
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
