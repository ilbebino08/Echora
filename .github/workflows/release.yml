name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build and test
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Sign and verify the APK
        env:
          ECHORA_SIGNING_KEYSTORE: ${{ secrets.ECHORA_SIGNING_KEYSTORE }}
          ECHORA_SIGNING_PASSWORD: ${{ secrets.ECHORA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          version=$("$sdk_tools/aapt" dump badging "$apk" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match APK version $version."
            exit 1
          fi
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/echora.XXXXXX.p12")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ECHORA_SIGNING_KEYSTORE" | base64 --decode > "$keystore"
          artifact="Echora-$GITHUB_REF_NAME-debug.apk"
          "$sdk_tools/apksigner" sign \
            --ks "$keystore" --ks-key-alias echora --ks-pass env:ECHORA_SIGNING_PASSWORD \
            --lineage .github/signing/echora.lineage --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --out "$artifact" "$apk"
          "$sdk_tools/apksigner" verify --verbose "$artifact"

      - name: Publish the preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Echora-$GITHUB_REF_NAME-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes \
            --title "Echora $GITHUB_REF_NAME Preview"
